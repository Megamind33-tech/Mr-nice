[package]
name = "gg-windows-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gambling Guard privileged Windows service: local DNS filter + WFP bypass prevention"

[[bin]]
name = "gambling-guard-service"
path = "src/main.rs"

[dependencies]
gg-rules-engine = { path = "../../../core/rules-engine" }
gg-dns-filter = { path = "../../../core/dns-filter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
tempfile = "3"
